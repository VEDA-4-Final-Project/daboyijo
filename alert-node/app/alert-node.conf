# 알림 노드 설정 — 실행 파일과 같은 디렉터리에서 읽음 (-c 로 덮어쓰기 가능)

broker_host = 172.20.32.34     # 브로커가 도는 곳 (중앙 서버 Pi)
broker_port = 8883             # MQTTS — 평문으로 되돌리려면 1883 + ca_path 비우기

# 브로커 검증용 CA 인증서 — 실행 파일 기준 상대 경로
# 비우면 평문 연결, git 에 안 올라가므로 각 기기에 직접 배치
ca_path     = certs/ca.crt

node_id     = alarm_rpi_01     # AlarmCommand.target_device 와 비교
topic       = veda/alarm/control

audio_dir   = sounds           # 실행 파일 기준 — 서버가 파일명만 보낼 때 찾는 위치
idle_text   = 감시 중          # 평상시 표시 — 64px 를 넘으면 양옆이 잘림
matrix_passes = 3              # 서버가 안 정하면 이만큼 흘림
matrix_brightness = 128        # 평상시(idle) 밝기 0~255 — 관제 앱 "적용" 전 기본값,
                               # 테스트는 잠깐 벗어났다 이 값으로 되돌아옴 (적용하면 갱신)
