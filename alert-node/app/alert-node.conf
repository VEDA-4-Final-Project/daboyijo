# 알림 노드 설정 - 실행 파일과 같은 디렉터리에서 읽는다 (-c 로 덮어쓰기 가능)

broker_host = 172.20.32.31     # 브로커가 도는 곳 (중앙 서버 Pi)
broker_port = 8883             # MQTTS. 평문으로 되돌리려면 1883 + ca_path 비우기

# 브로커 검증용 CA 인증서 — 실행 파일 기준 상대 경로(conf 와 같은 규칙).
# 비우면 TLS 없이 평문으로 붙는다. ca.crt 는 git 에 안 올라가므로 직접 배치할 것.
ca_path     = certs/ca.crt

node_id     = alarm_rpi_01     # AlarmCommand.target_device 와 비교한다
topic       = veda/alarm/control

audio_dir   = sounds           # 실행 파일 기준 상대 경로. 서버가 파일명만 보낼 때 여기서 찾는다
idle_text   = 감시 중          # 평상시 표시. 64px 를 넘으면 양옆이 잘린다
matrix_passes = 3          # 서버가 안 정하면 이만큼 흘린다
