# 중계 노드 설정 - 실행 파일과 같은 디렉터리에서 읽는다 (-c 로 덮어쓰기 가능)

broker_host  = 172.20.32.31    # 브로커가 도는 곳 (중앙 서버 Pi)
broker_port  = 8883            # MQTTS. 평문으로 되돌리려면 1883 + ca_path 비우기

# 브로커 검증용 CA 인증서 — 실행 파일 기준 상대 경로(conf 와 같은 규칙).
# 비우면 TLS 없이 평문으로 붙는다. ca.crt 는 git 에 안 올라가므로 직접 배치할 것.
ca_path      = certs/ca.crt

device_id    = wearable_01     # WearableData.device_id 로 실려 나간다
topic        = veda/wearable/data

hm10_addr    = 88:4a:ea:62:0b:03   # 연결할 HM-10 MAC. 모듈 교체 시 여기만 고친다
scan_ms      = 8000            # 스캔 제한 시간
reconnect_ms = 3000            # 끊긴 뒤 재시도 간격

debug_hex    = 0               # 1 이면 수신 원시 바이트를 덤프한다
